# instabox-waker — Wrangler config template.
# Copy as-is, fill in the placeholders, then `wrangler deploy`.
# Secrets (INSTABOX_API_KEY, CF_API_TOKEN) are NOT stored here: use `wrangler secret put`.
name = "instabox-waker"
main = "worker.js"
compatibility_date = "2026-10-01"

# Only reachable through your Access-protected custom domain.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "waker.example.com", custom_domain = true }
]

# Intentionally NO [triggers] / crons: this Worker never wakes the machine on its own.

[vars]
INSTABOX_MACHINE_ID = "m_xxxxxxxxxxxxxxxxxxxxxxxxxx"        # `instabox ls`
ACCESS_TEAM_DOMAIN  = "your-team.cloudflareaccess.com"      # Zero Trust team domain, no https://
ACCESS_AUD          = "REPLACE_WITH_ACCESS_APP_AUD_TAG"     # Access app → Overview → Application Audience (AUD) Tag
ADMIN_EMAILS        = "owner@example.com"                   # comma-separated; can open /admin, cannot be removed
CF_ACCOUNT_ID       = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
ACCESS_POLICY_ID    = "REPLACE_WITH_ACCESS_POLICY_ID"       # the reusable Allow policy attached to the app
DISPLAY_TIMEZONE    = ""                                    # optional IANA zone, e.g. "Asia/Shanghai"; empty = browser zone
